name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Windows 构建 ─────────────────────────────────────────────
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend to electron/renderer
        shell: pwsh
        run: |
          if (Test-Path electron/renderer) { Remove-Item electron/renderer -Recurse -Force }
          Copy-Item frontend/dist electron/renderer -Recurse

      - name: Build backend with PyInstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller backend.spec --distpath dist\ --workpath build\ --clean --noconfirm

      - name: Build Electron app (Windows)
        working-directory: electron
        run: |
          npm install
          npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: electron/dist/*.exe
          retention-days: 7

  # ── macOS 构建 ────────────────────────────────────────────────
  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy frontend to electron/renderer
        run: |
          rm -rf electron/renderer
          cp -r frontend/dist electron/renderer

      - name: Build backend with PyInstaller
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          pyinstaller backend.spec --distpath dist/ --workpath build/ --clean --noconfirm

      - name: Build Electron app (macOS)
        working-directory: electron
        run: |
          npm install
          npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: electron/dist/*.dmg
          retention-days: 7

  # ── 发布 Release ─────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          body: |
            ## 下载安装

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows 10/11 | `*-Setup-*.exe` | 双击安装，按向导完成 |
            | macOS 12+ | `*.dmg` | 打开 dmg，拖入 Applications |

            ## 首次使用
            1. 启动应用 → 点击「注册」创建账号
            2. 系统自动初始化默认工作空间
            3. 按 `Q` 键快速录入任务

            > 无需安装 Python 或 Node.js，双击即用。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
